[project]
name = "abuseipdb-proxy"
version = "0.1.1"
description = "Read-only localhost HTTP proxy answering IP-reputation questions against AbuseIPDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.32.5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "trustme>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abuseipdb_proxy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real AbuseIPDB API; runs only when ABUSEIPDB_LIVE_TESTS=1 (SPEC §6)",
    "loopback: may connect to numeric loopback addresses only, 127.0.0.0/8 and ::1 (SPEC §6)",
]
